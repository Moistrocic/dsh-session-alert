# dsh-session-alert 的 bundle patch。
#
# 官方安装方式：`dsh plugin --profile <name> add <本包路径或 npm 名>`
# 会把本包加入 profile 的 bundle 栈，profile 启动时合并这条 patch。
# 这一行同时挂载两个半边：
#
#   * Host 半边  (lib/index.js)  —— 事件监听、冷却合并、Windows 通知投递、
#                                   无控制台启动器的调用、以及设置页用的路由；
#   * 浏览器半边 (lib/client.js) —— 端别自报、焦点上报、SessionAlert 设置卡片，
#                                   由 client-modules 扫描本包的 dsh.client 字段加载。
#
# 不使用 CLI 时也可以手工把它加进 profile 自己的 cordis.patch.yml：
#
#   - insert:
#       - id: session-alert
#         name: 'dsh-session-alert'
- insert:
    - id: session-alert
      name: 'dsh-session-alert'
